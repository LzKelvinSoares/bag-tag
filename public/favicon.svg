<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#35CEB2"/>
      <stop offset="100%" stop-color="#1FA88E"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC76A"/>
      <stop offset="100%" stop-color="#F07820"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Handle outer (white) -->
  <rect x="213" y="126" width="86" height="60" rx="18" ry="18" fill="white"/>
  <!-- Handle inner cutout (teal) -->
  <rect x="230" y="142" width="52" height="30" rx="12" ry="12" fill="#29C8A6"/>

  <!-- Suitcase body -->
  <rect x="108" y="185" width="296" height="222" rx="22" ry="22" fill="white"/>

  <!-- Horizontal stripe -->
  <rect x="108" y="267" width="296" height="32" fill="rgba(41,200,166,0.18)"/>

  <!-- Wheels -->
  <circle cx="152" cy="417" r="15" fill="white" opacity="0.75"/>
  <circle cx="360" cy="417" r="15" fill="white" opacity="0.75"/>

  <!-- Tag string -->
  <line x1="332" y1="200" x2="366" y2="162" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.75"/>

  <!-- Price tag -->
  <g transform="translate(393,150) rotate(14)">
    <rect x="-63" y="-43" width="126" height="86" rx="16" ry="16" fill="url(#tag)"/>
    <circle cx="-43" cy="0" r="10" fill="rgba(255,255,255,0.9)"/>
    <circle cx="-43" cy="0" r="4.5" fill="#29C8A6"/>
  </g>
</svg>
