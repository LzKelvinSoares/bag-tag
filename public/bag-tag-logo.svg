<svg width="640" height="240" viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- Icon mark -->
  <g transform="translate(20,20)">
    <rect width="200" height="200" rx="44" fill="url(#bg)"/>

    <!-- Suitcase body -->
    <rect x="55" y="65.5" width="31.25" height="17.2" rx="5.5" fill="none" stroke="#FFFFFF" stroke-width="6.25"/>
    <rect x="54.7" y="65.6" width="90.6" height="76.6" rx="10.9" fill="#FFFFFF"/>
    <rect x="54.7" y="93" width="90.6" height="7.8" fill="#0D9488" opacity="0.18"/>
    <circle cx="71.9" cy="147.7" r="5.5" fill="#0D9488"/>
    <circle cx="128.1" cy="147.7" r="5.5" fill="#0D9488"/>

